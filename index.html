<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานเวร</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Use a Thai font for better readability */
        body {
            font-family: 'Sarabun', sans-serif;
        }
        /* Custom styles for the signature pad canvas */
        .signature-canvas {
            border: 2px dashed #ccc;
            border-radius: 0.5rem;
            cursor: crosshair;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto">
        <!-- Report Container -->
        <div id="report-container" class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- Header -->
            <div id="report-header" class="p-5 text-white">
                <h1 id="header-title" class="text-2xl font-bold"></h1>
                <p id="header-subtitle" class="text-sm opacity-90 mt-1"></p>
            </div>

            <!-- Hero Image -->
            <img id="hero-image" src="" alt="Report Image" class="w-full h-48 object-cover">

            <!-- Body -->
            <div class="p-6">
                <!-- Table Headers -->
                <div id="table-header" class="hidden md:flex bg-gray-50 p-3 rounded-lg font-bold text-gray-600 text-sm">
                    <div class="flex-3 text-center">รายชื่อครูเวร</div>
                    <div class="flex-2 text-center">ประทับเวลา</div>
                    <div class="flex-2 text-center">ลายเซ็น</div>
                    <div class="flex-2 text-center">หมายเหตุ</div>
                </div>

                <!-- Teacher List -->
                <div id="teacher-list" class="mt-4 space-y-4">
                    <!-- Dynamic rows will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-6 flex flex-col sm:flex-row gap-4 justify-center">
             <button id="save-report-btn" class="flex-1 bg-blue-600 text-white font-bold py-3 px-6 rounded-xl hover:bg-blue-700 transition-all shadow-md flex items-center justify-center gap-2">
                <i class="fas fa-save"></i> Save Report
            </button>
            <button id="share-line-btn" class="flex-1 bg-green-500 text-white font-bold py-3 px-6 rounded-xl hover:bg-green-600 transition-all shadow-md flex items-center justify-center gap-2">
                <i class="fab fa-line"></i> Share to LINE
            </button>
            <button id="download-pdf-btn" class="flex-1 bg-red-500 text-white font-bold py-3 px-6 rounded-xl hover:bg-red-600 transition-all shadow-md flex items-center justify-center gap-2">
                <i class="fas fa-file-pdf"></i> Download as PDF
            </button>
        </div>
    </div>

    <!-- Signature Pad Modal -->
    <div id="signature-pad-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-2xl max-w-lg w-full">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="text-lg font-semibold text-gray-800">ลงลายมือชื่อ</h3>
                <button id="close-pad-modal" class="text-gray-400 hover:text-gray-600 text-2xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4">
                <canvas id="signature-canvas" class="w-full h-64 signature-canvas"></canvas>
            </div>
            <div class="flex justify-between items-center gap-3 p-4 bg-gray-50 rounded-b-lg">
                <div>
                    <input type="file" id="signature-upload-input" class="hidden" accept="image/*">
                    <button id="upload-signature-btn" class="bg-teal-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-teal-600 transition-all flex items-center gap-2">
                        <i class="fas fa-upload"></i> Upload
                    </button>
                </div>
                <div class="flex gap-3">
                    <button id="clear-signature" class="bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-400 transition-all">
                        Clear
                    </button>
                    <button id="save-signature" class="bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 transition-all">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Signature View Modal -->
    <div id="signature-view-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-2xl max-w-2xl w-full">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="text-lg font-semibold text-gray-800">ลายมือชื่อ</h3>
                <button id="close-view-modal" class="text-gray-400 hover:text-gray-600 text-2xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 text-center">
                <img id="modal-signature-image" src="" alt="ลายมือชื่อ" class="max-w-full max-h-96 mx-auto border rounded-lg shadow-sm">
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Sweet Alert -->
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Loading Overlay -->
    <script src="https://cdn.jsdelivr.net/npm/gasparesganga-jquery-loading-overlay@2.1.7/dist/loadingoverlay.min.js"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Signature Pad -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/1.5.3/signature_pad.min.js"></script>
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        $(document).ready(function() {
            // --- CONFIG ---
            const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxD-nMt2RlYwJWx_5eZIkY5wG9nEhUjYhcRHX8Eu_8csgaMWh5_aVoVx0UcF-X9O0fu/exec";
            const LIFF_ID = "2007125937-QJ9xXpAm"; 

            // --- DATA ---
            // The JSON data for the Flex Message
            let flexMessageData = {
                "type": "bubble",
                "size": "giga",
                "header": {
                    "type": "box",
                    "layout": "vertical",
                    "paddingAll": "12px",
                    "backgroundColor": "#2E7D32",
                    "contents": [{
                        "type": "text",
                        "text": "ระบบรายงานเวร",
                        "weight": "bold",
                        "size": "xl",
                        "color": "#ffffff",
                        "wrap": true
                    }, {
                        "type": "text",
                        "text": "กลุ่มสาระการเรียนรู้วิทยาศาสตร์ และเทคโนโลยี",
                        "size": "sm",
                        "color": "#E8F5E9",
                        "wrap": true,
                        "margin": "sm"
                    }]
                },
                "hero": {
                    "type": "image",
                    "url": "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png",
                    "size": "full",
                    "aspectMode": "cover",
                    "aspectRatio": "16:9"
                },
                "body": {
                    "type": "box",
                    "layout": "vertical",
                    "paddingAll": "lg",
                    "contents": [{
                        "type": "box",
                        "layout": "horizontal",
                        "spacing": "md",
                        "contents": [/* This is the table header, we render it statically */]
                    }, {
                        "type": "separator",
                        "margin": "md"
                    }, {
                        "type": "box",
                        "layout": "horizontal",
                        "spacing": "md",
                        "margin": "md",
                        "contents": [{
                            "type": "text",
                            "text": "นายสมชาย ใจดี",
                            "size": "sm",
                            "align": "start",
                            "flex": 3
                        }, {
                            "type": "text",
                            "text": "06.30 น.",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }, {
                            "type": "box",
                            "layout": "vertical",
                            "flex": 2,
                            "contents": [{
                                "type": "image",
                                "url": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/%E0%B8%A5%E0%B8%B2%E0%B8%A2%E0%B9%80%E0%B8%8B%E0%B9%87%E0%B8%99_%E0%B8%8A%E0%B8%B1%E0%B8%A2_%E0%B8%8A%E0%B8%B4%E0%B8%94%E0%B8%8A%E0%B8%AD%E0%B8%9A.svg/200px-%E0%B8%A5%E0%B8%B2%E0%B8%A2%E0%B9%80%E0%B8%8B%E0%B9%87%E0%B8%99_%E0%B8%8A%E0%B8%B1%E0%B8%A2_%E0%B8%8A%E0%B8%B4%E0%B8%94%E0%B8%8A%E0%B8%AD%E0%B8%9A.svg.png",
                                "size": "xxs",
                                "align": "center",
                                "aspectMode": "fit",
                                "aspectRatio": "2:1"
                            }]
                        }, {
                            "type": "text",
                            "text": "-",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }]
                    }, {
                        "type": "separator",
                        "margin": "md"
                    }, {
                        "type": "box",
                        "layout": "horizontal",
                        "spacing": "md",
                        "margin": "md",
                        "contents": [{
                            "type": "text",
                            "text": "นางสมศรี ใจกล้า",
                            "size": "sm",
                            "align": "start",
                            "flex": 3
                        }, {
                            "type": "text",
                            "text": "06.30 น.",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }, {
                            "type": "text",
                            "text": "-",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }, {
                            "type": "text",
                            "text": "ไปราชการ",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }]
                    }, {
                        "type": "separator",
                        "margin": "md"
                    }, {
                        "type": "box",
                        "layout": "horizontal",
                        "spacing": "md",
                        "margin": "md",
                        "contents": [{
                            "type": "text",
                            "text": "นายมานะ อดทน",
                            "size": "sm",
                            "align": "start",
                            "flex": 3
                        }, {
                            "type": "text",
                            "text": "06.30 น.",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }, {
                             "type": "text",
                            "text": "-",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }, {
                            "type": "text",
                            "text": "-",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }]
                    }, {
                        "type": "separator",
                        "margin": "md"
                    }, {
                        "type": "box",
                        "layout": "horizontal",
                        "spacing": "md",
                        "margin": "md",
                        "contents": [{
                            "type": "text",
                            "text": "นายสบสน วุ่นวาย",
                            "size": "sm",
                            "align": "start",
                            "flex": 3
                        }, {
                            "type": "text",
                            "text": "06.30 น.",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }, {
                             "type": "text",
                            "text": "-",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }, {
                            "type": "text",
                            "text": "-",
                            "size": "sm",
                            "align": "center",
                            "flex": 2
                        }]
                    }],
                    "margin": "md"
                }
            };

            // --- SIGNATURE PAD ---
            const canvas = document.getElementById('signature-canvas');
            const signaturePad = new SignaturePad(canvas, {
                backgroundColor: 'rgb(255, 255, 255)'
            });
            let currentRowIndex = null;
            
            // Adjust canvas size on window resize
            function resizeCanvas() {
                const ratio = Math.max(window.devicePixelRatio || 1, 1);
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                canvas.getContext("2d").scale(ratio, ratio);
                signaturePad.clear(); // Clear signature after resize
            }
            window.addEventListener("resize", resizeCanvas);
            
            // --- LIFF INITIALIZATION ---
            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    console.log("LIFF initialized successfully");
                     if (!liff.isLoggedIn()) {
                        liff.login();
                    }
                })
                .catch(err => {
                    console.error("LIFF initialization failed", err);
                    Swal.fire({
                        icon: 'error',
                        title: 'LIFF Error',
                        text: 'Could not initialize LIFF. Some features may not work.'
                    });
                });

            // --- UI RENDERING ---
            function renderReport() {
                const header = flexMessageData.header;
                $('#report-header').css('backgroundColor', header.backgroundColor);
                $('#header-title').text(header.contents[0].text);
                $('#header-subtitle').text(header.contents[1].text);

                const hero = flexMessageData.hero;
                $('#hero-image').attr('src', hero.url);

                const teacherList = $('#teacher-list');
                teacherList.empty();

                // Filter for only teacher data rows
                const dataRows = flexMessageData.body.contents.filter(item => item.type === 'box' && item.layout === 'horizontal');

                dataRows.forEach((row, index) => {
                    if (index === 0) return; // Skip header row in the json
                    
                    const name = row.contents[0].text;
                    const time = row.contents[1].text;
                    const signature = row.contents[2];
                    const notes = row.contents[3].text;

                    let signatureHtml;
                    if (signature.type === 'box' && signature.contents[0].type === 'image') {
                        // Existing signature image
                        signatureHtml = `<img src="${signature.contents[0].url}" alt="Signature" class="h-8 mx-auto cursor-pointer signature-image">`;
                    } else if (signature.type === 'text' && signature.text === '-') {
                         // "Sign" button
                        signatureHtml = `<button class="sign-btn bg-blue-500 text-white px-3 py-1 text-xs rounded-md hover:bg-blue-600" data-index="${index}">ลงชื่อ</button>`;
                    } else {
                        signatureHtml = `<span class="text-gray-500">${signature.text || '-'}</span>`;
                    }
                    
                    const rowHtml = `
                        <div class="flex flex-col md:flex-row items-center border rounded-lg p-3 hover:bg-gray-50 transition-all">
                            <!-- Mobile Labels -->
                            <div class="w-full md:hidden text-xs font-bold text-gray-500 mb-2">รายชื่อครูเวร</div>
                            <div class="flex-3 w-full text-left md:text-left">${name}</div>

                            <div class="w-full md:hidden text-xs font-bold text-gray-500 mt-2 mb-1">ประทับเวลา</div>
                            <div class="flex-2 w-full text-left md:text-center text-gray-700">${time}</div>
                            
                            <div class="w-full md:hidden text-xs font-bold text-gray-500 mt-2 mb-1">ลายเซ็น</div>
                            <div class="flex-2 w-full text-left md:text-center h-8 flex items-center justify-start md:justify-center">${signatureHtml}</div>
                           
                            <div class="w-full md:hidden text-xs font-bold text-gray-500 mt-2 mb-1">หมายเหตุ</div>
                            <div class="flex-2 w-full text-left md:text-center text-gray-700 flex items-center justify-start md:justify-center gap-2">
                                <span>${notes}</span>
                                <button class="edit-note-btn text-blue-500 hover:text-blue-700 text-sm" data-index="${index}">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    teacherList.append(rowHtml);
                });
            }

            // --- EVENT HANDLERS ---

            // Open Signature Pad Modal
            $('#teacher-list').on('click', '.sign-btn', function() {
                currentRowIndex = $(this).data('index');
                $('#signature-pad-modal').removeClass('hidden').addClass('flex');
                resizeCanvas();
            });

            // Close Signature Pad Modal
            $('#close-pad-modal').on('click', () => {
                $('#signature-pad-modal').removeClass('flex').addClass('hidden');
                signaturePad.clear();
            });
            
            // Clear Signature
            $('#clear-signature').on('click', () => {
                signaturePad.clear();
            });

            // Function to update signature data
            function updateSignature(dataUrl) {
                const newSignatureObject = {
                    "type": "box",
                    "layout": "vertical",
                    "flex": 2,
                    "contents": [{
                        "type": "image",
                        "url": dataUrl, // NOTE: This is a data URL and will only display locally
                        "size": "xxs", "align": "center", "aspectMode": "fit", "aspectRatio": "2:1"
                    }]
                };
                flexMessageData.body.contents[currentRowIndex * 2].contents[2] = newSignatureObject;
                renderReport();
                $('#close-pad-modal').click();
            }
            
            // Save Signature from drawing
            $('#save-signature').on('click', () => {
                if (signaturePad.isEmpty()) {
                    Swal.fire('Empty Signature', 'Please draw a signature first.', 'warning');
                    return;
                }
                const dataUrl = signaturePad.toDataURL('image/png');
                updateSignature(dataUrl);
            });

            // Trigger file input for signature upload
            $('#upload-signature-btn').on('click', function() {
                $('#signature-upload-input').click();
            });

            // Handle signature file upload
            $('#signature-upload-input').on('change', function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    updateSignature(dataUrl);
                };
                reader.readAsDataURL(file);
                // Reset file input to allow uploading the same file again
                $(this).val(''); 
            });

            // Open Signature View Modal
            $('#teacher-list').on('click', '.signature-image', function() {
                const imgSrc = $(this).attr('src');
                $('#modal-signature-image').attr('src', imgSrc);
                $('#signature-view-modal').removeClass('hidden').addClass('flex');
            });

            // Close Signature View Modal
             $('#close-view-modal').on('click', () => {
                $('#signature-view-modal').removeClass('flex').addClass('hidden');
            });
            
            // Edit Note
            $('#teacher-list').on('click', '.edit-note-btn', async function() {
                const index = $(this).data('index');
                const currentNote = flexMessageData.body.contents[index * 2].contents[3].text;

                const { value: newNote } = await Swal.fire({
                    title: 'Edit Note',
                    input: 'text',
                    inputValue: currentNote,
                    showCancelButton: true,
                    inputValidator: (value) => {
                        if (!value) {
                            return 'You need to write something!'
                        }
                    }
                })

                if (newNote !== null && newNote !== undefined) {
                    flexMessageData.body.contents[index * 2].contents[3].text = newNote;
                    renderReport();
                }
            });

            // Download PDF
            $('#download-pdf-btn').on('click', function() {
                const reportElement = document.getElementById('report-container');
                const opt = {
                    margin: 0.5,
                    filename: 'duty-report.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                $.LoadingOverlay("show");
                html2pdf().from(reportElement).set(opt).save().then(() => {
                    $.LoadingOverlay("hide");
                });
            });

            // Share to LINE
            $('#share-line-btn').on('click', function() {
                if (!liff.isInClient()) {
                     Swal.fire('Not in LINE', 'Please open this page in the LINE app to share.', 'info');
                     return;
                }
                 if (!liff.isApiAvailable('shareTargetPicker')) {
                    Swal.fire('Unsupported', 'Share Target Picker is not available in your LINE version.', 'warning');
                    return;
                }
                
                // IMPORTANT: Before sharing, ensure all image URLs in flexMessageData are public HTTPS URLs.
                // You should replace data URLs with the Drive URLs after saving the report.
                
                liff.shareTargetPicker([{
                    'type': 'flex',
                    'altText': 'รายงานการปฏิบัติหน้าที่เวร',
                    'contents': flexMessageData
                }])
                .then(() => {
                    Swal.fire('Sent!', 'The report has been sent.', 'success');
                })
                .catch(function(res) {
                    Swal.fire('Send Error', 'Could not send the report. Please try again.', 'error');
                });
            });

            // Save Report to Google Sheet
            $('#save-report-btn').on('click', function() {
                if (!APP_SCRIPT_URL || APP_SCRIPT_URL === "YOUR_APP_SCRIPT_WEB_APP_URL") {
                    Swal.fire('Configuration Error', 'Please set the APP_SCRIPT_URL variable in the script.', 'error');
                    return;
                }
                
                $.LoadingOverlay("show");

                // 1. Prepare data for submission
                const reportPayload = [];
                const dataRows = flexMessageData.body.contents.filter(item => item.type === 'box' && item.layout === 'horizontal');

                dataRows.forEach((row, index) => {
                    if (index === 0) return; // Skip header

                    const item = {
                        name: row.contents[0].text,
                        time: row.contents[1].text,
                        notes: row.contents[3].text,
                        signature: ''
                    };

                    const signatureObj = row.contents[2];
                    if (signatureObj.type === 'box' && signatureObj.contents[0].type === 'image') {
                        const signatureUrl = signatureObj.contents[0].url;
                        // Check if it's a data URL that needs to be uploaded
                        if (signatureUrl.startsWith('data:image')) {
                            const [header, base64Data] = signatureUrl.split(',');
                            item.signatureData = base64Data;
                            item.mimeType = header.match(/:(.*?);/)[1];
                            item.fileName = `signature-${item.name.replace(/\s/g, '_')}-${Date.now()}.png`;
                        } else {
                            item.signature = signatureUrl; // It's already a public URL
                        }
                    } else {
                        item.signature = signatureObj.text; // It's text, like '-'
                    }
                    reportPayload.push(item);
                });

                // 2. Use URLSearchParams for submission
                const formData = new URLSearchParams();
                formData.append('reportData', JSON.stringify(reportPayload));

                // 3. Fetch POST request to Apps Script
                fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    body: formData,
                })
                .then(response => response.json())
                .then(data => {
                    $.LoadingOverlay("hide");
                    if (data.status === 'success') {
                        Swal.fire('Success', data.message, 'success');
                        // Optionally, you can re-fetch data or update UI with returned Drive URLs
                    } else {
                        throw new Error(data.message);
                    }
                })
                .catch(error => {
                    $.LoadingOverlay("hide");
                    console.error('Error:', error);
                    Swal.fire('Error', 'Failed to save report: ' + error.message, 'error');
                });
            });

            // --- INITIAL RENDER ---
            renderReport();
        });
    </script>

</body>
</html>
